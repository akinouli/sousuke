<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUSUKE - スケジュール作成</title>
    <link rel="stylesheet" href="css/schedule.css">
</head>

<body>

    <!-- 上部固定メニュー ========================= -->
    <header class="schedule-header">

        <!-- タイトル -->
        <div class="logo">SOUSUKE<span>スケジュール作成</span></div>

        <!-- 進捗ナビ -->
        <div id="progress-indicator" class="progress-indicator">
            <span class="active"></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span class="create-status">作成</span>
        </div>

    </header>

    <!-- スケジュール作成セクション ========================= -->
    <main class="schedule-main">

        <!-- セクション① ページ数 -->
        <section class="form-section active-section" data-section="0">
            <div class="section-content">
                <h1>ページ数</h1>
                <p>本文の制作予定ページ数を入力しよう</p>

                <div class="page-count-area">
                    <input type="number" id="page-count" min="1" inputmode="numeric"><span>ページ</span>
                </div>
            </div>
        </section>

        <!-- セクション② 工程リスト ========================= -->
        <section class="form-section" data-section="1">
            <div class="section-content">
                <h1>工程リスト</h1>
                <p>
                    作業工程と確保したい作業時間を入力しよう<br>
                    「＝」をつまんで優先順に並び替えできるよ
                </p>

                <div id="process-list"></div>

                <button type="button" id="add-process">
                    ＋ 工程追加
                </button>
            </div>
        </section>


        <!-- セクション③ 活動時間 ========================= -->
        <section class="form-section" data-section="2">
            <div class="section-content">
                <h1>活動時間</h1>
                <p>曜日ごとに作業できる時間を設定しよう</p>

                <div id="weekday-list"></div>
            </div>
        </section>


        <!-- セクション④ 休日 ========================= -->
        <section class="form-section" data-section="3">
            <div class="section-content">
                <h1>休日</h1>
                <p>
                    活動しない日があれば選択しよう<br>
                    作業期間内にある休日を計算対象外にするよ
                </p>

                <div class="calendar">
                    <div class="calendar-header">
                        <button type="button" id="holiday-prev">＜</button>
                        <div id="holiday-month"></div>
                        <button type="button" id="holiday-next">＞</button>
                    </div>

                    <div class="week-header">
                        <span>日</span>
                        <span>月</span>
                        <span>火</span>
                        <span>水</span>
                        <span>木</span>
                        <span>金</span>
                        <span>土</span>
                    </div>

                    <div id="holiday-calendar" class="calendar-grid"></div>
                </div>
            </div>
        </section>


        <!-- セクション⑤ 作業期間 -->
        <section class="form-section" data-section="4">
            <div class="section-content">
                <h1>作業期間</h1>
                <p>作業開始日と締切日を選択しよう</p>

                <div class="calendar">
                    <div class="calendar-header">
                        <button type="button" id="period-prev">＜</button>
                        <div id="period-month"></div>
                        <button type="button" id="period-next">＞</button>
                    </div>

                    <div class="week-header">
                        <span>日</span>
                        <span>月</span>
                        <span>火</span>
                        <span>水</span>
                        <span>木</span>
                        <span>金</span>
                        <span>土</span>
                    </div>

                    <div id="period-calendar" class="calendar-grid"></div>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <button type="button" class="next-button">
            <span class="next-button-text">次へ</span>
            <span>▼</span>
        </button>
    </footer>

    <script src="js/schedule.js"></script>

</body>

</html>
